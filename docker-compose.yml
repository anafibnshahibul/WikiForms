version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wikiforms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wikiforms_local
      MYSQL_USER: wikiforms
      MYSQL_PASSWORD: wikiforms_local_pass
      MYSQL_ROOT_PASSWORD: wikiforms_root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wikiforms", "-pwikiforms_local_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wikiforms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: wikiforms_local
      DB_USERNAME: wikiforms
      DB_PASSWORD: wikiforms_local_pass
    volumes:
      - ./backend:/app
      - /app/vendor
    expose:
      - "9000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wikiforms_frontend
    volumes:
      - frontend_dist:/output

  web:
    build:
      context: ./docker/lighttpd
      dockerfile: Dockerfile
    container_name: wikiforms_web
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - frontend_dist:/var/www/public_html
      - ./docker/lighttpd/lighttpd.conf:/etc/lighttpd/lighttpd.conf:ro

volumes:
  db_data:
  frontend_dist:

name: Print Repository File Tree

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  print-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tree Tool
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Display File Tree in Action Logs
        run: |
          echo "=================================================="
          echo "          WIKIFORMS FILE TREE DIRECTORY           "
          echo "=================================================="
          echo ""
          tree -I 'node_modules|vendor|.git|.idea|.vscode|dist|build|storage/framework/cache|storage/framework/sessions|storage/framework/views|storage/logs'
          echo ""
          echo "=================================================="

server.modules = ( "mod_access", "mod_alias", "mod_rewrite", "mod_proxy", "mod_setenv" )

server.document-root = "/var/www/public_html"
server.port          = 80
server.errorlog      = "/dev/stderr"
index-file.names     = ("index.html")

mimetype.assign = (
  ".html"  => "text/html",
  ".css"   => "text/css",
  ".js"    => "application/javascript",
  ".json"  => "application/json",
  ".svg"   => "image/svg+xml",
  ".woff2" => "font/woff2",
  ".png"   => "image/png",
  ".ico"   => "image/x-icon"
)

setenv.add-response-header = (
  "X-Frame-Options"        => "DENY",
  "X-Content-Type-Options" => "nosniff",
  "Referrer-Policy"        => "strict-origin-when-cross-origin"
)

$HTTP["url"] =~ "^/api/" {
  proxy.server = ( "" => (( "host" => "backend", "port" => 9000 )) )
}

url.rewrite-once = (
  "^/assets/.*$"         => "$0",
  "^/fonts/.*$"          => "$0",
  "^/favicon.*$"         => "$0",
  "^/manifest.*$"        => "$0",
  "^/robots.*$"          => "$0",
  "^/api/(.*)\?(.*)$"    => "/index.html",
  "^/api(/.*)?$"         => "/index.html",
  "^/view(/.*)?$"        => "/index.html",
  "^/create$"            => "/index.html",
  "^/contribute$"        => "/index.html",
  "^/my-forms$"          => "/index.html",
  "^/about$"             => "/index.html",
  "^/privacy$"           => "/index.html",
  "^/terms$"             => "/index.html",
  "^/$"                  => "/index.html"
)

$HTTP["url"] =~ "^/assets/" {
  setenv.add-response-header = ( "Cache-Control" => "public, max-age=31536000, immutable" )
}
